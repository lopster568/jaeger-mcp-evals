name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python3 -m unittest discover -s harness/tests
      - name: scenario readiness
        run: |
          for f in harness/scenarios/*.json; do
            name=$(basename "$f" .json)
            python3 harness/bench.py readiness "$name"
          done
      - name: makefile parses
        run: |
          make -n setup smoke
          make test
