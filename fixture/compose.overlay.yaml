# Overlay for the jaeger-mcp-evals fixture. Layer on top of compose.yaml + compose.full.yaml +
# compose.observability.yaml (what `make start` uses). Publishes fixed host
# ports for the harness and swaps in the MCP-enabled Jaeger config.
services:
  jaeger:
    ports:
      - "16686:16686"
    volumes:
      - ./overlay/jaeger-config.yml:/etc/jaeger/config.yml
      - ./src/jaeger/ui-config.json:/etc/jaeger/ui-config.json
  flagd:
    ports:
      - "8013:8013"
      - "8016:8016"
  # Six services the benchmark never uses are switched off with the profile "unused" (never
  # enabled). It reads traces from Jaeger only; flags are flipped in the flag file and checked
  # through flagd's OFREP. Nothing may depend on them, so the depends_on lists that named
  # them are replaced (this needs Docker Compose 2.24 or newer). See fixture/FIXTURE.md.
  opensearch:
    profiles: ["unused"]
  prometheus:
    profiles: ["unused"]
  grafana:
    profiles: ["unused"]
  opamp-server:
    profiles: ["unused"]
  flagd-ui:
    profiles: ["unused"]
  telemetry-docs:
    profiles: ["unused"]
  frontend-proxy:
    depends_on: !override
      frontend:
        condition: service_healthy
      jaeger:
        condition: service_started
  otel-collector:
    volumes:
      - ./overlay/otelcol-config-extras.yml:/etc/otelcol-config-extras.yml
    depends_on: !override
      jaeger:
        condition: service_started
  # 2026-09-18 deviation: the demo's 20 MiB limit on these two Go
  # services is too tight on this machine. After about an hour both sit at the ceiling,
  # the GC thrashes, health probes time out, a third of orders fail and payment is
  # barely called. Limits only: no code, image, flag or span content changes.
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      - GOMEMLIMIT=48MiB
  checkout:
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      - GOMEMLIMIT=48MiB
  # 2026-09-18, same deviation, second round. With swap off the machine
  # still spent ~80% of CPU in the kernel re-reading files: astronomy-db
  # had been OOM-killed at 80 MiB (grafana and prometheus, also pinned, are now switched off). A container pinned at its memory ceiling evicts and
  # re-reads its own pages endlessly. Limits only; no code, image, flag or span changes.
  astronomy-db:
    deploy:
      resources:
        limits:
          memory: 256M
  # 2026-09-20, same deviation, third round. payment (Node.js) sat at 136 of 140 MiB with
  # 98% CPU and a failing health probe 40 minutes after boot, while the machine read disk at
  # 500 to 870 MB/s. It is the root-cause service of paymentFailure, so it has to be healthy.
  # The JVM services (ad, fraud-detection, kafka) also sit near their limits but
  # at under 5% CPU, which is normal heap sizing, so they are left alone. Limits only.
  payment:
    deploy:
      resources:
        limits:
          memory: 300M
  # Fourth round, same deviation. Containers pinned at their memory limit thrashed the page
  # cache: sustained disk reads near 1 GB/s and a load of about 13 on 6 cores. load-generator
  # (k6 with headless chromium) and ad sat at 78 to 99% of their limits. Limits only.
  load-generator:
    deploy:
      resources:
        limits:
          memory: 1G
  ad:
    deploy:
      resources:
        limits:
          memory: 600M
  quote:
    deploy:
      resources:
        limits:
          memory: 80M
  fraud-detection:
    deploy:
      resources:
        limits:
          memory: 600M
  # Trajectory store, off by default: started only with `--profile store`. UI and OTLP HTTP
  # (/v1/traces) share container port 6006. Pinned by digest.
  phoenix:
    image: arizephoenix/phoenix@sha256:440c03af939e775343788a4e9e0fed72df6fd87ee287c771e94494ab3037c790
    profiles: ["store"]
    ports:
      - "16006:6006"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix-data:/mnt/data
volumes:
  phoenix-data:
